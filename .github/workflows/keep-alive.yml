name: Keep Supabase awake

# Supabase pauses free projects after 7 days without requests. One read every
# three days is enough to keep the database running.
on:
  schedule:
    - cron: "0 5 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from cafe_rating_stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/cafe_rating_stats?select=cafe_id&limit=1")
          echo "HTTP $status"
          test "$status" = "200"
